[package]
name = "quaternion-launcher"
version = "1.1.0"
edition = "2021"
authors = ["Quaternion Developers"]
description = "Lightweight bootstrapper, updater, and protocol launcher for Quaternion (Polytoria Client)"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
zip = "2.2"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
url = "2.5"
directories = "5.0"
tempfile = "3.10"
colored = "2.1"
futures-util = "0.3"
slint = "1.18.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
